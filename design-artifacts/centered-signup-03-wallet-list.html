<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pulseflow centered signup — Wallet list</title><style>
:root{color-scheme:dark;--bg:oklch(.1805 .0155 101.7992);--fg:oklch(.9606 .0027 106.4492);--card:oklch(.2171 .0096 97.7974);--muted:oklch(.5916 .0075 106.6256);--border:oklch(.288 .0107 99.2633);--secondary:oklch(.288 .0107 99.2633);--orange:#f6851b}*{box-sizing:border-box}html,body{margin:0;background:transparent;color:var(--fg);font-family:"DM Sans","Avenir Next",sans-serif}body{padding:18px}.app{max-width:1180px;min-height:720px;margin:auto;background:var(--bg);border:1px solid var(--border);border-radius:14px;overflow:hidden;box-shadow:0 20px 70px #0008}.nav{height:65px;border-bottom:1px solid var(--border);display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 24px}.logo{width:40px;height:40px;border-radius:10px;background:#222;display:grid;place-items:center;font-size:23px;font-weight:800;color:#ddd}.nav-title{font-size:11px;color:var(--muted)}.close{text-align:right}.close button{width:32px;height:32px;border:0;border-radius:7px;background:transparent;color:var(--muted);font-size:17px}.page{min-height:655px;display:grid;place-items:center;padding:32px 18px}.auth{width:min(100%,430px)}.head{text-align:center;margin-bottom:22px}.head .mini{width:9px;height:9px;border-radius:50%;background:var(--fg);margin:0 auto 17px;box-shadow:0 0 0 5px #ffffff0a}.head h1{font-size:24px;letter-spacing:-.04em;margin:0 0 7px}.head p{font-size:12px;color:var(--muted);margin:0}.list{border:1px solid var(--border);border-radius:10px;overflow:hidden;background:var(--card)}.wallet{width:100%;height:58px;border:0;background:transparent;color:var(--fg);padding:0 13px;display:flex;align-items:center;text-align:left;font-size:12px}.wallet+.wallet{border-top:1px solid var(--border)}.wallet.primary{background:#ffffff05}.icon{width:32px;height:32px;border-radius:7px;background:var(--secondary);display:grid;place-items:center;margin-right:11px}.primary .icon{background:var(--orange);color:#2c1402}.copy b{display:block;font-size:12px}.copy small{display:block;color:var(--muted);font-size:9px;margin-top:3px}.tag{margin-left:auto;border:1px solid var(--border);border-radius:99px;padding:4px 7px;color:#a5a6a0;font-size:8px}.arrow{margin-left:auto;color:#777a74}.or{display:flex;align-items:center;gap:11px;color:#666963;font-size:9px;margin:20px 0 11px}.or:before,.or:after{content:"";height:1px;background:var(--border);flex:1}.traditional{display:grid;grid-template-columns:1fr 1fr;gap:8px}.traditional button{height:36px;border:0;border-radius:7px;background:var(--secondary);color:#aeb0a9;font-size:11px}.security{text-align:center;color:#666963;font-size:9px;line-height:1.5;margin:18px 0 0}.security b{color:#8d8f88;font-weight:500}.signin{text-align:center;color:var(--muted);font-size:11px;margin-top:15px}.signin a{color:var(--fg)}.components{text-align:center;font:9px ui-monospace,monospace;color:#4f524c;margin-top:13px}@media(max-width:520px){.nav{grid-template-columns:1fr 1fr;padding:0 16px}.nav-title{display:none}.auth{max-width:390px}.traditional{grid-template-columns:1fr}}@media(prefers-reduced-motion:no-preference){.auth{animation:in .45s ease-out both}.wallet{transition:background .15s}.wallet:hover{background:#ffffff07}@keyframes in{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}}
</style></head><body><div class="app"><header class="nav"><div class="logo">P</div><div class="nav-title">Create account</div><div class="close"><button aria-label="Close">×</button></div></header><main class="page"><section class="auth"><div class="head"><div class="mini"></div><h1>Choose how to continue</h1><p>Wallets are prioritized for the best Pulseflow experience.</p></div><div class="list"><button class="wallet primary"><span class="icon">◆</span><span class="copy"><b>MetaMask</b><small>Detected in browser</small></span><span class="tag">RECOMMENDED</span></button><button class="wallet"><span class="icon">◉</span><span class="copy"><b>Base Wallet</b><small>Connect with Base</small></span><span class="arrow">→</span></button><button class="wallet"><span class="icon">▣</span><span class="copy"><b>Coinbase Wallet</b><small>Connect with extension or app</small></span><span class="arrow">→</span></button></div><div class="or">TRADITIONAL ACCOUNT</div><div class="traditional"><button>G&nbsp; Continue with Google</button><button>✉&nbsp; Continue with email</button></div><p class="security"><b>Signature only.</b> We never request your recovery phrase.</p><p class="signin">Already registered? <a href="#">Sign in</a></p><div class="components">CARD · BUTTON · SEPARATOR</div></section></main></div></body></html>
